name: terraform

# PR: offline validate + cloud plan (OIDC). Main: apply platform then bundle (hands-off).
on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform.yml", ".github/scripts/**"]
  push:
    branches: [main]
    paths:
      - terraform/**
      - .github/workflows/terraform.yml
      - .github/workflows/deploy.yml
      - .github/scripts/**
  workflow_dispatch:
    inputs:
      deployment_slug:
        description: >-
          Optional sandbox slug (ephemeral names/state). Leave empty for production.
          Prefer the "deploy" workflow for slug sandboxes.
        required: false
        type: string
      bundle_only:
        description: >-
          Deploy/update the asset bundle only (platform must already exist).
          Use this to catch up when Terraform ran but the bundle did not.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.set.outputs.terraform }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            terraform:
              - 'terraform/**'
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "terraform=${{ steps.filter.outputs.terraform }}" >> "$GITHUB_OUTPUT"
          else
            echo "terraform=true" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: [changes]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        layer: ["10-infra", "20-platform"]
    defaults:
      run:
        working-directory: terraform/live/${{ matrix.layer }}
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Format check
        run: terraform fmt -check -recursive ../../..

      - name: Init (no backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

      - name: Test (mocked providers, offline)
        run: terraform test

      - name: Validate deployment env resolver (offline)
        if: matrix.layer == '20-platform'
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/validate-resolve-deployment.sh

  plan-infra:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [validate]
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform/live/10-infra
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      DATABRICKS_AUTH_TYPE: azure-cli
      INPUT_DEPLOYMENT_SLUG: ""
      VAR_STATE_RESOURCE_GROUP_NAME: ${{ vars.STATE_RESOURCE_GROUP_NAME }}
      VAR_STATE_STORAGE_ACCOUNT_NAME: ${{ vars.STATE_STORAGE_ACCOUNT_NAME }}
      VAR_WORKSPACE_NAME: ${{ vars.WORKSPACE_NAME }}
      VAR_UC_STORAGE_ACCOUNT_NAME: ${{ vars.UC_STORAGE_ACCOUNT_NAME }}
      VAR_RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Resolve production deployment inputs
        run: bash ../../../.github/scripts/load-deployment-env.sh

      - name: Init backend (AAD)
        run: bash ../../../.github/scripts/terraform-backend-init.sh "$BACKEND_KEY_INFRA"

      - name: Plan (layer 10)
        run: |
          bash ../../../.github/scripts/terraform-with-deployment-vars.sh plan -no-color -input=false 2>&1 | tee "${{ runner.temp }}/plan-10.txt"

      - name: Plan summary
        run: |
          {
            echo "## Terraform plan — 10-infra"
            echo '```terraform'
            tail -c 55000 "${{ runner.temp }}/plan-10.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  plan-platform:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [validate, plan-infra]
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform/live/20-platform
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      DATABRICKS_AUTH_TYPE: azure-cli
      INPUT_DEPLOYMENT_SLUG: ""
      VAR_STATE_RESOURCE_GROUP_NAME: ${{ vars.STATE_RESOURCE_GROUP_NAME }}
      VAR_STATE_STORAGE_ACCOUNT_NAME: ${{ vars.STATE_STORAGE_ACCOUNT_NAME }}
      VAR_CATALOG_NAME: ${{ vars.CATALOG_NAME }}
      VAR_SCHEMA_NAME: ${{ vars.SCHEMA_NAME }}
      VAR_WAREHOUSE_NAME: ${{ vars.WAREHOUSE_NAME }}
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Resolve production deployment inputs
        run: bash ../../../.github/scripts/load-deployment-env.sh

      - name: Init backend (AAD)
        run: bash ../../../.github/scripts/terraform-backend-init.sh "$BACKEND_KEY_PLATFORM"

      - name: Plan (layer 20)
        run: bash ../../../.github/scripts/terraform-with-deployment-vars.sh plan -no-color -input=false 2>&1 | tee "${{ runner.temp }}/plan-20.txt"

      - name: Plan summary
        run: |
          {
            echo "## Terraform plan — 20-platform"
            echo '```terraform'
            tail -c 55000 "${{ runner.temp }}/plan-20.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply-infra:
    if: |
      (github.event_name != 'workflow_dispatch' || inputs.bundle_only != true) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.ref == 'refs/heads/main' && needs.changes.outputs.terraform == 'true'))
    needs: [changes, validate]
    runs-on: ubuntu-latest
    environment: production
    outputs:
      workspace_url: ${{ steps.out.outputs.workspace_url }}
    defaults:
      run:
        working-directory: terraform/live/10-infra
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      DATABRICKS_AUTH_TYPE: azure-cli
      INPUT_DEPLOYMENT_SLUG: ${{ github.event.inputs.deployment_slug }}
      VAR_STATE_RESOURCE_GROUP_NAME: ${{ vars.STATE_RESOURCE_GROUP_NAME }}
      VAR_STATE_STORAGE_ACCOUNT_NAME: ${{ vars.STATE_STORAGE_ACCOUNT_NAME }}
      VAR_AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      VAR_WORKSPACE_NAME: ${{ vars.WORKSPACE_NAME }}
      VAR_UC_STORAGE_ACCOUNT_NAME: ${{ vars.UC_STORAGE_ACCOUNT_NAME }}
      VAR_RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
      VAR_ADMIN_GROUP: ${{ vars.ADMIN_GROUP }}
      VAR_DATA_ENGINEER_GROUP: ${{ vars.DATA_ENGINEER_GROUP }}
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Resolve deployment inputs
        run: |
          bash ../../../.github/scripts/load-deployment-env.sh
          echo "Deploying in **$DEPLOYMENT_MODE** mode" >> "$GITHUB_STEP_SUMMARY"

      - name: Init backend (AAD)
        run: bash ../../../.github/scripts/terraform-backend-init.sh "$BACKEND_KEY_INFRA"

      - name: Apply (layer 10)
        run: bash ../../../.github/scripts/terraform-with-deployment-vars.sh apply -auto-approve -input=false

      - name: Capture workspace URL
        id: out
        run: echo "workspace_url=$(terraform output -raw workspace_url)" >> "$GITHUB_OUTPUT"

  apply-platform:
    if: |
      (github.event_name != 'workflow_dispatch' || inputs.bundle_only != true) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.ref == 'refs/heads/main' && needs.changes.outputs.terraform == 'true'))
    needs: [changes, apply-infra]
    runs-on: ubuntu-latest
    environment: production
    outputs:
      warehouse_id: ${{ steps.out.outputs.warehouse_id }}
      catalog_name: ${{ steps.out.outputs.catalog_name }}
      schema_name: ${{ steps.out.outputs.schema_name }}
    defaults:
      run:
        working-directory: terraform/live/20-platform
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      DATABRICKS_AUTH_TYPE: azure-cli
      INPUT_DEPLOYMENT_SLUG: ${{ github.event.inputs.deployment_slug }}
      VAR_STATE_RESOURCE_GROUP_NAME: ${{ vars.STATE_RESOURCE_GROUP_NAME }}
      VAR_STATE_STORAGE_ACCOUNT_NAME: ${{ vars.STATE_STORAGE_ACCOUNT_NAME }}
      VAR_CATALOG_NAME: ${{ vars.CATALOG_NAME }}
      VAR_SCHEMA_NAME: ${{ vars.SCHEMA_NAME }}
      VAR_WAREHOUSE_NAME: ${{ vars.WAREHOUSE_NAME }}
      VAR_ADMIN_GROUP: ${{ vars.ADMIN_GROUP }}
      VAR_DATA_ENGINEER_GROUP: ${{ vars.DATA_ENGINEER_GROUP }}
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Resolve deployment inputs
        run: bash ../../../.github/scripts/load-deployment-env.sh

      - name: Init backend (AAD)
        run: bash ../../../.github/scripts/terraform-backend-init.sh "$BACKEND_KEY_PLATFORM"

      - name: Apply (layer 20)
        run: bash ../../../.github/scripts/terraform-with-deployment-vars.sh apply -auto-approve -input=false

      - name: Capture platform outputs
        id: out
        run: |
          echo "warehouse_id=$(terraform output -raw warehouse_id)" >> "$GITHUB_OUTPUT"
          echo "catalog_name=$(terraform output -raw catalog_name)" >> "$GITHUB_OUTPUT"
          echo "schema_name=$(terraform output -raw schema_name)" >> "$GITHUB_OUTPUT"

  bundle-deploy:
    needs: [apply-infra, apply-platform]
    if: needs.apply-platform.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: bundle
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: databricks/setup-cli@main
      - name: Deploy asset bundle and run smoke test
        env:
          DATABRICKS_HOST: ${{ needs.apply-infra.outputs.workspace_url }}
          WAREHOUSE_ID: ${{ needs.apply-platform.outputs.warehouse_id }}
          BUNDLE_CATALOG: ${{ needs.apply-platform.outputs.catalog_name }}
          BUNDLE_SCHEMA: ${{ needs.apply-platform.outputs.schema_name }}
        run: bash ../.github/scripts/bundle-deploy-ci.sh

  bundle-only:
    if: github.event_name == 'workflow_dispatch' && inputs.bundle_only
    needs: [changes]
    runs-on: ubuntu-latest
    environment: production
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      INPUT_DEPLOYMENT_SLUG: ${{ github.event.inputs.deployment_slug }}
      VAR_STATE_RESOURCE_GROUP_NAME: ${{ vars.STATE_RESOURCE_GROUP_NAME }}
      VAR_STATE_STORAGE_ACCOUNT_NAME: ${{ vars.STATE_STORAGE_ACCOUNT_NAME }}
      VAR_CATALOG_NAME: ${{ vars.CATALOG_NAME }}
      VAR_SCHEMA_NAME: ${{ vars.SCHEMA_NAME }}
      VAR_ADMIN_GROUP: ${{ vars.ADMIN_GROUP }}
      VAR_DATA_ENGINEER_GROUP: ${{ vars.DATA_ENGINEER_GROUP }}
    defaults:
      run:
        working-directory: terraform/live/20-platform
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
      - name: Resolve deployment inputs
        run: bash ../../../.github/scripts/load-deployment-env.sh
      - name: Read platform outputs from state
        id: tf
        run: |
          bash ../../../.github/scripts/terraform-backend-init.sh "$BACKEND_KEY_PLATFORM"
          echo "warehouse_id=$(terraform output -raw warehouse_id)" >> "$GITHUB_OUTPUT"
          echo "catalog_name=$(terraform output -raw catalog_name)" >> "$GITHUB_OUTPUT"
          echo "schema_name=$(terraform output -raw schema_name)" >> "$GITHUB_OUTPUT"
      - name: Read workspace URL from state
        id: ws
        working-directory: terraform/live/10-infra
        run: |
          bash ../../../.github/scripts/terraform-backend-init.sh "$BACKEND_KEY_INFRA"
          echo "workspace_url=$(terraform output -raw workspace_url)" >> "$GITHUB_OUTPUT"
      - uses: databricks/setup-cli@main
      - name: Deploy asset bundle and run smoke test
        working-directory: bundle
        env:
          DATABRICKS_HOST: ${{ steps.ws.outputs.workspace_url }}
          WAREHOUSE_ID: ${{ steps.tf.outputs.warehouse_id }}
          BUNDLE_CATALOG: ${{ steps.tf.outputs.catalog_name }}
          BUNDLE_SCHEMA: ${{ steps.tf.outputs.schema_name }}
        run: bash ../.github/scripts/bundle-deploy-ci.sh