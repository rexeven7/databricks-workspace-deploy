name: bundle

# PR: validate when DATABRICKS_HOST is configured.
# Main: deploy on bundle/** changes (reads Terraform state for host/warehouse — no manual vars).
# Full stack on terraform/** changes: see terraform.yml (apply → bundle-deploy).
on:
  pull_request:
    paths: ["bundle/**", ".github/workflows/bundle.yml"]
  push:
    branches: [main]
    paths:
      - bundle/**
      - .github/workflows/bundle.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"

jobs:
  validate:
    if: ${{ vars.DATABRICKS_HOST != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bundle
    steps:
      - uses: actions/checkout@v5
      - uses: databricks/setup-cli@main
      - name: Validate (dev target)
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: databricks bundle validate -t dev

  deploy:
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
      - name: Resolve deployment inputs
        env:
          VAR_STATE_RESOURCE_GROUP_NAME: ${{ vars.STATE_RESOURCE_GROUP_NAME }}
          VAR_STATE_STORAGE_ACCOUNT_NAME: ${{ vars.STATE_STORAGE_ACCOUNT_NAME }}
          VAR_CATALOG_NAME: ${{ vars.CATALOG_NAME }}
          VAR_SCHEMA_NAME: ${{ vars.SCHEMA_NAME }}
          VAR_ADMIN_GROUP: ${{ vars.ADMIN_GROUP }}
          VAR_DATA_ENGINEER_GROUP: ${{ vars.DATA_ENGINEER_GROUP }}
        run: bash .github/scripts/load-deployment-env.sh
      - name: Read platform outputs from state
        id: platform
        working-directory: terraform/live/20-platform
        run: |
          bash ../../../.github/scripts/terraform-backend-init.sh "$BACKEND_KEY_PLATFORM"
          echo "warehouse_id=$(terraform output -raw warehouse_id)" >> "$GITHUB_OUTPUT"
          echo "catalog_name=$(terraform output -raw catalog_name)" >> "$GITHUB_OUTPUT"
          echo "schema_name=$(terraform output -raw schema_name)" >> "$GITHUB_OUTPUT"
      - name: Read workspace URL from state
        id: infra
        working-directory: terraform/live/10-infra
        run: |
          bash ../../../.github/scripts/terraform-backend-init.sh "$BACKEND_KEY_INFRA"
          echo "workspace_url=$(terraform output -raw workspace_url)" >> "$GITHUB_OUTPUT"
      - uses: databricks/setup-cli@main
      - name: Deploy asset bundle and run smoke test
        working-directory: bundle
        env:
          DATABRICKS_HOST: ${{ steps.infra.outputs.workspace_url }}
          WAREHOUSE_ID: ${{ steps.platform.outputs.warehouse_id }}
          BUNDLE_CATALOG: ${{ steps.platform.outputs.catalog_name }}
          BUNDLE_SCHEMA: ${{ steps.platform.outputs.schema_name }}
        run: bash ../.github/scripts/bundle-deploy-ci.sh
