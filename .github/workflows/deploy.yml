name: deploy

# One-click interview / sandbox deploy: Terraform (10 → 20) then bundle, all via OIDC.
# Does not mutate committed tfvars — inputs are resolved at runtime.
on:
  workflow_dispatch:
    inputs:
      deployment_slug:
        description: >-
          Unique slug for this deploy (e.g. interview-jun25). Drives resource
          names and a dedicated state prefix under databricks/<slug>/.
        required: true
        type: string
      run_bundle_job:
        description: Run sample_ingest after bundle deploy (smoke test)
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"

jobs:
  apply-infra:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      workspace_url: ${{ steps.out.outputs.workspace_url }}
    defaults:
      run:
        working-directory: terraform/live/10-infra
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      INPUT_DEPLOYMENT_SLUG: ${{ github.event.inputs.deployment_slug }}
      VAR_STATE_RESOURCE_GROUP_NAME: ${{ vars.STATE_RESOURCE_GROUP_NAME }}
      VAR_STATE_STORAGE_ACCOUNT_NAME: ${{ vars.STATE_STORAGE_ACCOUNT_NAME }}
      VAR_AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      VAR_ADMIN_GROUP: ${{ vars.ADMIN_GROUP }}
      VAR_DATA_ENGINEER_GROUP: ${{ vars.DATA_ENGINEER_GROUP }}
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Resolve sandbox deployment inputs
        run: |
          bash ../../../.github/scripts/load-deployment-env.sh
          echo "## Deploy **$DEPLOYMENT_MODE** — \`$TF_VAR_workspace_name\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Init backend (AAD)
        run: bash ../../../.github/scripts/terraform-backend-init.sh "$BACKEND_KEY_INFRA"

      - name: Apply (layer 10)
        run: terraform apply -auto-approve -var-file=env/prod.tfvars -input=false

      - name: Capture workspace URL
        id: out
        run: echo "workspace_url=$(terraform output -raw workspace_url)" >> "$GITHUB_OUTPUT"

  apply-platform:
    needs: apply-infra
    runs-on: ubuntu-latest
    environment: production
    outputs:
      warehouse_id: ${{ steps.out.outputs.warehouse_id }}
      catalog_name: ${{ steps.out.outputs.catalog_name }}
    defaults:
      run:
        working-directory: terraform/live/20-platform
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      DATABRICKS_AUTH_TYPE: azure-cli
      INPUT_DEPLOYMENT_SLUG: ${{ github.event.inputs.deployment_slug }}
      VAR_STATE_RESOURCE_GROUP_NAME: ${{ vars.STATE_RESOURCE_GROUP_NAME }}
      VAR_STATE_STORAGE_ACCOUNT_NAME: ${{ vars.STATE_STORAGE_ACCOUNT_NAME }}
      VAR_ADMIN_GROUP: ${{ vars.ADMIN_GROUP }}
      VAR_DATA_ENGINEER_GROUP: ${{ vars.DATA_ENGINEER_GROUP }}
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Resolve sandbox deployment inputs
        run: bash ../../../.github/scripts/load-deployment-env.sh

      - name: Init backend (AAD)
        run: bash ../../../.github/scripts/terraform-backend-init.sh "$BACKEND_KEY_PLATFORM"

      - name: Apply (layer 20)
        run: terraform apply -auto-approve -var-file=env/prod.tfvars -input=false

      - name: Capture platform outputs
        id: out
        run: |
          echo "warehouse_id=$(terraform output -raw warehouse_id)" >> "$GITHUB_OUTPUT"
          echo "catalog_name=$(terraform output -raw catalog_name)" >> "$GITHUB_OUTPUT"

  bundle:
    needs: [apply-infra, apply-platform]
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: bundle
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: databricks/setup-cli@main

      - name: Deploy asset bundle and run smoke test
        env:
          DATABRICKS_HOST: ${{ needs.apply-infra.outputs.workspace_url }}
          WAREHOUSE_ID: ${{ needs.apply-platform.outputs.warehouse_id }}
          BUNDLE_CATALOG: ${{ needs.apply-platform.outputs.catalog_name }}
          BUNDLE_SCHEMA: sales
          BUNDLE_RUN_SAMPLE_INGEST: ${{ inputs.run_bundle_job }}
        run: bash ../.github/scripts/bundle-deploy-ci.sh
